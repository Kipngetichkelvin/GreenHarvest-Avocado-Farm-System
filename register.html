<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - GreenHarvest</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel=stylesheet href=css/responsive.css>
    <link rel=stylesheet href=css/form.css>
</head>

<body>


    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <div class="logo">

                <a href="index.html">
                    GreenHarvest
                </a>

            </div>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="seedlings.html">
                        Seedlings
                    </a>
                </li>

                <li>
                    <a href="services.html">
                        Services
                    </a>
                </li>

                <li>
                    <a href="marketplace.html">
                        Market
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Registration -->
    <main>

        <section class="auth-section">

            <div class="auth-container register-container">


                <div class="auth-header">

                    <h1>Create Your Account</h1>

                    <p>
                        Join GreenHarvest and access
                        our agricultural services.
                    </p>

                </div>


                <form id="registerForm">


                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="e.g. 0712345678"
                            required
                        >

                    </div>


                    <!-- Role -->
                    <div class="form-group">

                        <label for="role">
                            Account Type
                        </label>

                        <select
                            id="role"
                            name="role"
                            required
                        >

                            <option value="">
                                Select account type
                            </option>

                            <option value="farmer">
                                Farmer
                            </option>

                            <option value="buyer">
                                Buyer
                            </option>

                            <option value="agronomist">
                                Agronomist
                            </option>

                        </select>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- Terms -->
                    <div class="form-options">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            I agree to the
                            <a href="#">
                                Terms and Conditions
                            </a>

                        </label>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Create Account
                    </button>


                    <!-- Message -->
                    <div
                        id="registerMessage"
                        class="form-message">
                    </div>


                </form>


                <!-- Login -->
                <div class="auth-footer">

                    <p>
                        Already have an account?

                        <a href="login.html">
                            Login here
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-bottom">

            <p>
                &copy; 2026 GreenHarvest Avocado Company.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>

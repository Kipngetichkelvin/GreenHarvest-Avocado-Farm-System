<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Testing - GreenHarvest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel=stylesheet href=css/responsive.css>
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">GreenHarvest</a>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="seedlings.html">Seedlings</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="marketplace.html">Market</a></li>

            <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="login.html" class="btn">Login</a>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Soil Testing</h1>
        <p>Understand your soil and improve avocado farm productivity.</p>
    </section>

    <section class="form-section">

        <form id="soilTestForm">

            <h2>Request Soil Testing</h2>

            <label for="farmerName">Farmer Name</label>
            <input type="text" id="farmerName" name="farmerName" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="farmLocation">Farm Location</label>
            <input type="text" id="farmLocation" name="farmLocation" required>

            <label for="farmSize">Farm Size (Acres)</label>
            <input type="number" id="farmSize" name="farmSize" min="0" step="0.1">

            <label for="soilType">Known Soil Type</label>
            <select id="soilType" name="soilType">
                <option value="">Select soil type</option>
                <option value="loam">Loam</option>
                <option value="clay">Clay</option>
                <option value="sandy">Sandy</option>
                <option value="volcanic">Volcanic</option>
                <option value="unknown">I Don't Know</option>
            </select>

            <label for="testingReason">Reason for Testing</label>
            <textarea id="testingReason" name="testingReason" rows="5"
                placeholder="Tell us why you want your soil tested..."></textarea>

            <button type="submit" class="btn">Submit Soil Test Request</button>

        </form>

    </section>

</main>

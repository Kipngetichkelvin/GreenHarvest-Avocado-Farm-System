<main>

    <section class="page-header">
        <h1>Farm Management</h1>
        <p>Keep your avocado farm information organized in one place.</p>
    </section>

    <section class="form-section">

        <form id="farmForm">

            <h2>Register Your Farm</h2>

            <label for="farmName">Farm Name</label>
            <input type="text" id="farmName" name="farmName" required>

            <label for="farmLocation">Farm Location</label>
            <input type="text" id="farmLocation" name="farmLocation" required>

            <label for="farmSize">Farm Size (Acres)</label>
            <input type="number" id="farmSize" name="farmSize" min="0" step="0.1" required>

            <label for="treeCount">Number of Avocado Trees</label>
            <input type="number" id="treeCount" name="treeCount" min="0" required>

            <label for="variety">Main Avocado Variety</label>
            <select id="variety" name="variety">
                <option value="">Select variety</option>
                <option value="hass">Hass</option>
                <option value="fuerte">Fuerte</option>
                <option value="pinkerton">Pinkerton</option>
                <option value="other">Other</option>
            </select>

            <label for="farmAge">Farm Age</label>
            <input type="text" id="farmAge" name="farmAge" placeholder="e.g. 3 years">

            <label for="irrigation">Irrigation System</label>
            <select id="irrigation" name="irrigation">
                <option value="">Select option</option>
                <option value="drip">Drip Irrigation</option>
                <option value="sprinkler">Sprinkler</option>
                <option value="manual">Manual</option>
                <option value="none">No Irrigation</option>
            </select>

            <button type="submit" class="btn">Save Farm Information</button>

        </form>

    </section>

</main>

</body>
</html>

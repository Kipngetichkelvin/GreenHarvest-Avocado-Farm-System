<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - GreenHarvest</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel=stylesheet href=css/responsive.css>
    <link rel=stylesheet href=css/form.css>
</head>

<body>


    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <div class="logo">

                <a href="index.html">
                    GreenHarvest
                </a>

            </div>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="seedlings.html">
                        Seedlings
                    </a>
                </li>

                <li>
                    <a href="services.html">
                        Services
                    </a>
                </li>

                <li>
                    <a href="marketplace.html">
                        Market
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Login -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-header">

                    <h1>Welcome Back</h1>

                    <p>
                        Login to your GreenHarvest account
                    </p>

                </div>


                <form id="loginForm">


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Remember -->
                    <div class="form-options">

                        <label>

                            <input
                                type="checkbox"
                                name="remember"
                            >

                            Remember me

                        </label>


                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Login
                    </button>


                    <!-- Message -->
                    <div
                        id="loginMessage"
                        class="form-message">
                    </div>


                </form>


                <!-- Register -->
                <div class="auth-footer">

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Create one
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-bottom">

            <p>
                &copy; 2026 GreenHarvest Avocado Company.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>
